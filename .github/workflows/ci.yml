name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pinned to the same version .pre-commit-config.yaml uses. Unpinned, a ruff
      # release that widens the default rule set turns main red with no code
      # change (0.16.0 did exactly that), and CI disagrees with the local hook.
      - run: pip install ruff==0.15.7
      - run: ruff check .
      - name: install project package
        run: python -m pip install .
      - name: protocol and state tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: byte-compile
        run: python -m py_compile chat.py hooks/session_inbox.py
      - name: smoke test CLI
        run: python chat.py --help

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  # Merged from bot-governance.yml (deleted). This job only writes its
  # result to the GitHub-provided job summary. It never calls the GitHub
  # API or changes pull requests, branches, or files.
  report:
    name: Report corroborated bot signals
    # Fork pull requests must not run governance logic. The title signals below
    # are only meaningful for branches maintained by this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Record bot-governance signal
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          signal=""
          case "$PR_TITLE" in
            "🎨 Palette:"*)
              signal="internal repository + Palette title prefix"
              ;;
            "⚡ Bolt:"*)
              signal="internal repository + Bolt title prefix"
              ;;
            "🛡️ Sentinel:"*)
              signal="internal repository + Sentinel title prefix"
              ;;
            "fix(deps): "*)
              if [[ "$PR_AUTHOR" == "app/renovate" ]]; then
                signal="internal repository + Renovate identity + dependency title prefix"
              fi
              ;;
          esac

          {
            echo "## Bot governance (report only)"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Head repository: ${HEAD_REPOSITORY}"
            echo "- Pull request author: ${PR_AUTHOR}"
            echo "- Title: ${PR_TITLE}"

            if [[ -n "$signal" ]]; then
              echo "- Result: matched corroborated bot signal"
              echo "- Signal: ${signal}"
            else
              echo "- Result: no corroborated bot signal matched"
            fi

            echo "- Action: report only; no pull request, branch, or source-file mutation performed"
          } >> "$GITHUB_STEP_SUMMARY"
