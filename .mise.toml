# Mise configuration for agent-chat-plugin
# https://mise.jdx.dev/
#
# agent-chat-plugin is a single-file, dependency-free stdlib CLI. The only dev
# tool is ruff; there is nothing to build or install.

[tools]
python = "3.14.7"
# Same version as CI and .pre-commit-config.yaml. "latest" silently changes the
# rule set under you: ruff 0.16.0 widened the defaults and turned main red.
ruff = "0.16.5"

[tasks.lint]
description = "Lint with ruff"
run = "ruff check ."

[tasks.smoke]
description = "Smoke-test the CLI"
run = "python chat.py --help"
